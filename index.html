<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meal prep à deux</title>
<meta name="description" content="Meal prep du mois : sessions, recettes et listes de courses.">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal prep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1411" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone column (max 560px), sticky header, fixed bottom tab bar.
   Home = the month's 5 sessions; a session opens as a page; a recipe opens as a full-screen sheet.
   Plates and sessions are labelled like meal-prep lids: a strip of masking tape (Y, L, S1…S5). */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E7ECE6; --ink:#18211C; --muted:#5B6961; --line:#D3DBD4;
  --y:#1D6A55; --y-soft:#DCEDE6; --l:#B23660; --l-soft:#F7E0E7;
  --tape:#EBDFB4; --tape-ink:#4A3E1A; --done:#1D6A55; --done-soft:#DCEDE6; --warn:#8A5200; --warn-soft:#FBEBD0;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#171E1A; --surface-2:#202923; --ink:#E6ECE8; --muted:#97A59D; --line:#2B362F;
  --y:#62C3A2; --y-soft:#1B362D; --l:#EF84A6; --l-soft:#3F1E2A;
  --tape:#4A4330; --tape-ink:#F0E4BD; --done:#62C3A2; --done-soft:#1B362D; --warn:#F2B35A; --warn-soft:#3A2A10; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E1A; --surface-2:#202923; --ink:#E6ECE8; --muted:#97A59D; --line:#2B362F;
  --y:#62C3A2; --y-soft:#1B362D; --l:#EF84A6; --l-soft:#3F1E2A;
  --tape:#4A4330; --tape-ink:#F0E4BD; --done:#62C3A2; --done-soft:#1B362D; --warn:#F2B35A; --warn-soft:#3A2A10; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--y);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.month{font-family:var(--f-display);font-size:24px;line-height:1.1;margin:2px 0 0;font-weight:400}
.month select{font:inherit;color:inherit;background:transparent;border:0;padding:0;appearance:none;-webkit-appearance:none}
.who{display:flex;gap:6px;flex-shrink:0}
.who button{font-family:var(--f-mono);font-weight:600;font-size:14px;width:40px;height:34px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.who button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:transparent;transform:rotate(-2deg)}
.status{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px}

main.wrap{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:10px 0 -6px}
.hint{font-size:14px;color:var(--muted);margin:0}
.card{background:var(--surface);border-radius:var(--r);padding:18px}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;border-radius:12px;padding:13px 16px;background:var(--ink);color:var(--bg);width:100%;text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.chev{color:var(--muted);flex-shrink:0}
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.06em;padding:3px 10px 2px;transform:rotate(-2.5deg);box-shadow:0 1px 0 rgba(0,0,0,.08)}

/* Month progress */
.progress{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--surface-2)}
.dots i.on{background:var(--done)}
.progress b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Next session hero */
.hero{display:flex;flex-direction:column;gap:12px}
.hero .label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--y)}
.hero h3{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0}
.dishes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dishes li{display:flex;gap:10px;align-items:baseline;font-size:16px}
.dishes li .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:30px;flex-shrink:0}

/* Session list */
.slist{display:flex;flex-direction:column;gap:10px}
.scard{display:flex;gap:14px;align-items:flex-start;width:100%;background:var(--surface);border-radius:var(--r);padding:16px}
.scard .tape{flex-shrink:0;margin-top:2px}
.scard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.scard .names{font-weight:600;font-size:15px;line-height:1.35}
.scard .s{font-size:13px;color:var(--muted)}
.scard.is-done{background:transparent;border:1.5px dashed var(--line)}
.scard.is-done .names{color:var(--muted);font-weight:500}
.pill{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.next{background:var(--tape);color:var(--tape-ink)}

/* Session page */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:6px 0;color:var(--muted)}
.shead h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin:6px 0 6px}
.donebtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 16px;border-radius:14px;font-weight:600;font-size:16px;background:var(--ink);color:var(--bg)}
.donebtn .box{width:22px;height:22px;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center;flex-shrink:0}
.donebtn.is-done{background:var(--done-soft);color:var(--done)}
.donebtn.is-done .box{background:var(--done);border-color:var(--done)}
.donebtn.is-done .box::after{content:"";width:6px;height:11px;border:solid var(--done-soft);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dish{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);padding:14px;border-radius:4px}
.dishlist{display:flex;flex-direction:column;gap:2px}
.dishlist .dish:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
.dishlist .dish:last-child{border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
.dish .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dish .n{font-weight:600}
.dish .rmacro{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--y)}
.dish .rmacro.l{color:var(--l)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.first{background:var(--warn-soft);color:var(--warn)}
.badge.freeze{background:var(--y-soft);color:var(--y)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:12px;font-size:15px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0}

/* Shopping */
.shop-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);flex-shrink:0}
.bar{display:block;height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--y);border-radius:4px;transition:width .25s}
.cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:16px 0 2px}
.cat.placard{margin-top:20px}
.items{list-style:none;margin:0 -10px;padding:0}
.items li label{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer}
.items li label:active{background:var(--surface-2)}
.items input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;margin:0;display:grid;place-items:center;background:var(--surface)}
.items input:checked{background:var(--y);border-color:var(--y)}
.items input:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.items input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.items.placard span{color:var(--muted)}
.qty{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.linkbtn{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:12px}

/* Stats + folds */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stat .u{font-size:12px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.brow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.brow span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card h4{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Recipes list */
.list{display:flex;flex-direction:column;gap:2px}
.list > *{background:var(--surface);padding:14px;border-radius:4px}
.list > *:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
.list > *:last-child{border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}

/* Recipe sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheet-in{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sheet-bar .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:10px}
.sheet-bar .back{color:var(--ink)}
.sheet h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.sheet .wrap.body{display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.plates{display:flex;flex-direction:column;gap:14px}
.plate{position:relative;border-radius:12px;padding:20px 14px 12px}
.plate.y{background:var(--y-soft)}
.plate.l{background:var(--l-soft)}
.plate p{margin:0 0 8px;font-size:15px}
.plate .tape{position:absolute;top:-9px;left:12px}
.plate.l .tape{transform:rotate(1.8deg)}
.macros{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 12px}
.plate.y .macros{color:var(--y)}
.plate.l .macros{color:var(--l)}
.macros b{font-weight:600}
.block p{margin:0;font-size:15px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px;text-align:center}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--y)}
.tabs svg{width:24px;height:24px}
.lock{display:flex;flex-direction:column;gap:14px;margin-top:8vh}
.lock h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.lock p{margin:0;color:var(--muted);font-size:15px}
.lock input{font:inherit;font-size:17px;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.lock input:focus{outline:none;border-color:var(--y)}
.lock .err{color:var(--l);font-size:14px;min-height:20px}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 8px}
.empty p{margin:0 0 8px;color:var(--muted);font-size:15px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="eyebrow">Meal prep à deux</div>
      <h1 class="month" id="month-title">Plan du mois</h1>
    </div>
    <div class="who" role="group" aria-label="Mon assiette">
      <button type="button" id="who-y" data-who="Y" aria-pressed="true" title="Assiette Y">Y</button>
      <button type="button" id="who-l" data-who="L" aria-pressed="false" title="Assiette L">L</button>
    </div>
  </div>
</header>

<main class="wrap" id="view">
  <div class="card empty">
    <h3>Les sessions du mois arrivent</h3>
    <p>5 sessions de meal prep à lancer quand vous voulez, chacune avec 3 plats, sa liste de courses et ses recettes.</p>
    <p>Chargement…</p>
  </div>
</main>

<div class="sheet" id="sheet" hidden></div>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button type="button" data-tab="sessions" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2.5"/><path d="M3 11h18M8 4.5h8"/></svg>
      Sessions</button>
    <button type="button" data-tab="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-2zM2.5 11h19M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/></svg>
      Recettes</button>
    <button type="button" data-tab="infos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>
      Repères</button>
  </div>
</nav>

<script>
(function(){
  "use strict";
  var S = {months:[], key:null, month:null, who:"Y", tab:"sessions", session:null, recipe:null,
           checks:{}, done:{}, offline:false, loaded:false};

  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
  function lsJSON(k){ try{ return JSON.parse(ls(k)||"null"); }catch(e){ return null; } }
  var w=ls("mp-who"); if(w==="Y"||w==="L") S.who=w;
  var tb=ls("mp-tab"); if(["sessions","recipes","infos"].indexOf(tb)>=0) S.tab=tb;

  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function pad(n){ return (n<10?"0":"")+n; }
  function todayISO(){ var t=new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); }
  function toDate(iso){ var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function fmt(iso,opt){ try{ return toDate(iso).toLocaleDateString("fr-FR",opt); }catch(e){ return iso; } }
  function chev(){ return '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'; }
  function backIcon(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'; }
  function rec(id){ var r=(S.month&&S.month.recipes)||[]; for(var i=0;i<r.length;i++) if(r[i].id===id) return r[i]; return null; }
  function sess(id){ var s=(S.month&&S.month.sessions)||[]; for(var i=0;i<s.length;i++) if(s[i].id===id) return s[i]; return null; }
  function pname(k){ var p=S.month&&S.month.people; return (p&&p[k])||k; }
  function sNum(s){ return s.id.replace(/^S/,""); }

  /* ---------- state per month (stored on this phone) ---------- */
  function loadLocal(){
    S.checks=lsJSON("mp-checks-"+S.key)||{};
    S.done=lsJSON("mp-done-"+S.key)||{};
  }
  function saveChecks(){ ls("mp-checks-"+S.key, JSON.stringify(S.checks)); }
  function saveDone(){ ls("mp-done-"+S.key, JSON.stringify(S.done)); }

  function pickKey(){
    var keys=S.months.map(function(m){return m.key;}).sort();
    if(!keys.length) return null;
    if(S.key && keys.indexOf(S.key)>=0) return S.key;
    var cur=todayISO().slice(0,7), best=null;
    keys.forEach(function(k){ if(k<=cur) best=k; });
    return best||keys[0];
  }
  function setMonths(list, offline){
    S.months=list.filter(function(m){ return m && m.key && m.sessions && m.recipes && m.format>=2; }).sort(function(a,b){return a.key<b.key?-1:1;});
    S.offline=!!offline;
    var k=pickKey(), changed=k!==S.key; S.key=k; S.month=null;
    S.months.forEach(function(m){ if(m.key===k) S.month=m; });
    if(changed){ S.session=null; loadLocal(); }
    if(S.session && !sess(S.session)) S.session=null;
    S.loaded=true; render();
  }

  function shopStats(s){
    var total=0, done=0;
    (s.shopping||[]).forEach(function(g){ if(g.placard) return; g.items.forEach(function(it){ total++; if(S.checks[it.id]) done++; }); });
    return {done:done,total:total};
  }
  function nextSession(){
    var ss=S.month.sessions||[];
    for(var i=0;i<ss.length;i++) if(!S.done[ss[i].id]) return ss[i];
    return null;
  }
  function macroLine(r){
    return S.who==="Y" ? r.y.kcal+" kcal · "+r.y.prot+" g prot · "+r.y.fib+" g fibres" : "≈ "+r.l.kcal+" kcal · version plaisir";
  }

  /* ---------- views ---------- */
  function viewSessions(){
    var m=S.month, ss=m.sessions||[], nd=ss.filter(function(s){return S.done[s.id];}).length, h='';
    h+='<div class="progress"><div class="dots">'+ss.map(function(s){return '<i class="'+(S.done[s.id]?"on":"")+'"></i>';}).join("")+'</div><span class="hint"><b>'+nd+'/'+ss.length+'</b> sessions faites</span></div>';
    var nx=nextSession();
    if(nx){
      var st=shopStats(nx);
      h+='<section class="card hero"><div class="label">À préparer ensuite</div><h3>'+esc(nx.title)+'</h3>'+
        '<ul class="dishes">'+nx.recipes.map(function(id){ var r=rec(id); return r?'<li><span class="k">'+esc(r.id)+'</span><span>'+esc(r.name)+'</span></li>':''; }).join("")+'</ul>'+
        '<div class="meta"><span>'+esc(nx.duration)+'</span><span>6 repas à deux</span><span>≈ '+nx.budget+' €</span><span>Courses '+st.done+'/'+st.total+'</span></div>'+
        '<button type="button" class="btn" data-session="'+esc(nx.id)+'">Ouvrir la session</button></section>';
    } else {
      h+='<section class="card empty"><h3>Les 5 sessions sont faites</h3><p>Les sessions du mois prochain arrivent ici le 1er.</p></section>';
    }
    h+='<h2 class="sec">Les sessions du mois</h2><div class="slist">';
    ss.forEach(function(s){
      var d=S.done[s.id], st=shopStats(s), isNext=nx && nx.id===s.id;
      var names=s.recipes.map(function(id){ var r=rec(id); return r?r.name:id; }).join(" · ");
      var pill=d?'<span class="pill done">Faite le '+esc(fmt(d,{day:"numeric",month:"short"}))+'</span>':(isNext?'<span class="pill next">À faire ensuite</span>':'<span class="pill">À faire</span>');
      h+='<button type="button" class="scard'+(d?" is-done":"")+'" data-session="'+esc(s.id)+'"><span class="tape">'+esc(s.id)+'</span><span class="t"><span class="names">'+esc(names)+'</span><span class="s">'+esc(s.duration)+' · ≈ '+s.budget+' € · courses '+st.done+'/'+st.total+'</span>'+pill+'</span>'+chev()+'</button>';
    });
    h+='</div>';
    if(m.intro) h+='<p class="hint">'+esc(m.intro)+'</p>';
    return h;
  }

  function viewSession(s){
    var d=S.done[s.id], st=shopStats(s), h='';
    h+='<div class="shead"><button type="button" class="back" data-back="1">'+backIcon()+'Sessions</button>'+
       '<div><span class="tape">'+esc(s.id)+'</span></div><h1>'+esc(s.title)+'</h1>'+
       '<div class="meta"><span>'+esc(s.duration)+'</span><span>6 repas à deux</span><span>≈ '+s.budget+' € de courses</span></div></div>';
    h+='<button type="button" class="donebtn'+(d?" is-done":"")+'" data-done="'+esc(s.id)+'"><span class="box"></span>'+(d?'Faite le '+esc(fmt(d,{weekday:"long",day:"numeric",month:"long"})):'Marquer la session comme faite')+'</button>';
    if(d) h+='<p class="hint" style="margin-top:-8px;text-align:center">Touche à nouveau pour la remettre à faire.</p>';

    h+='<h2 class="sec">Les 3 plats</h2><div class="dishlist">';
    s.recipes.forEach(function(id){
      var r=rec(id); if(!r) return;
      var b='';
      if(s.eatFirst===id) b+='<span class="badge first">À manger en premier</span>';
      if(s.freeze===id) b+='<span class="badge freeze">Se congèle</span>';
      h+='<button type="button" class="dish" data-recipe="'+esc(r.id)+'"><span class="t"><span class="n">'+esc(r.name)+'</span><span class="rmacro'+(S.who==="L"?" l":"")+'">'+esc(macroLine(r))+'</span>'+(b?'<span class="badges">'+b+'</span>':'')+'</span>'+chev()+'</button>';
    });
    h+='</div>';
    if(s.avg && S.who==="Y") h+='<p class="hint">Moyenne de tes 3 assiettes : '+s.avg.kcal+' kcal, '+s.avg.prot+' g de protéines, '+s.avg.fib+' g de fibres.</p>';

    h+='<h2 class="sec">Liste de courses</h2><section class="card" id="shop-card"><div class="shop-head"><b>À acheter</b><span class="count" id="shop-count">'+st.done+'/'+st.total+'</span></div><span class="bar"><i id="shop-bar" style="width:'+(st.total?Math.round(100*st.done/st.total):0)+'%"></i></span>';
    (s.shopping||[]).forEach(function(g){
      h+='<div class="cat'+(g.placard?" placard":"")+'">'+esc(g.cat)+'</div><ul class="items'+(g.placard?" placard":"")+'">';
      g.items.forEach(function(it){
        var parts=String(it.text).split(" · "), name=parts[0], q=parts.slice(1).join(" · ");
        h+='<li><label><input type="checkbox" id="chk-'+esc(it.id)+'" data-item="'+esc(it.id)+'"'+(S.checks[it.id]?" checked":"")+'><span>'+esc(name)+(q?' <span class="qty">'+esc(q)+'</span>':'')+'</span></label></li>';
      });
      h+='</ul>';
    });
    if(st.done>0) h+='<button type="button" class="linkbtn" data-reset="'+esc(s.id)+'">Tout décocher</button>';
    h+='</section>';

    if(s.order && s.order.length) h+='<h2 class="sec">Ordre de préparation</h2><section class="card"><ol class="steps">'+s.order.map(function(x){return '<li><span>'+esc(x)+'</span></li>';}).join("")+'</ol></section>';
    var ef=rec(s.eatFirst), fz=rec(s.freeze), cons=[];
    if(ef) cons.push('<li><b>À manger en premier :</b> '+esc(ef.name)+' ('+esc(ef.keeps)+').</li>');
    if(fz) cons.push('<li><b>Se congèle :</b> '+esc(fz.name)+'. Congèle ses boîtes dès le jour J si vous ne les mangez pas dans les 3-4 jours.</li>');
    cons.push('<li>Les autres plats se gardent 4 jours au frigo.</li>');
    h+='<h2 class="sec">Conservation</h2><section class="card"><ul>'+cons.join("")+'</ul></section>';
    return h;
  }

  function viewRecipes(){
    var m=S.month, h='';
    (m.sessions||[]).forEach(function(s){
      h+='<h2 class="sec">'+esc(s.title)+(S.done[s.id]?' · faite':'')+'</h2><div class="list">';
      s.recipes.forEach(function(id){
        var r=rec(id); if(!r) return;
        h+='<button type="button" class="dish" data-recipe="'+esc(r.id)+'"><span class="t"><span class="n">'+esc(r.name)+'</span><span class="hint">'+esc(r.time)+'</span><span class="rmacro'+(S.who==="L"?" l":"")+'">'+esc(macroLine(r))+'</span></span>'+chev()+'</button>';
      });
      h+='</div>';
    });
    return h;
  }

  function viewInfos(){
    var m=S.month, tg=m.targets||{}, a=m.avg||{}, h='';
    h+='<section class="card"><h4>Dîner moyen de '+esc(pname("Y"))+'</h4><div class="stats"><div class="stat"><div class="v">'+(a.kcal||"–")+'</div><div class="u">kcal</div></div><div class="stat"><div class="v">'+(a.prot||"–")+'</div><div class="u">g protéines</div></div><div class="stat"><div class="v">'+(a.fib||"–")+'</div><div class="u">g fibres</div></div></div>';
    if(tg.kcalMid && a.kcal) h+='<p class="note">Objectif du jour : '+esc(tg.kcal)+' et '+esc(tg.prot)+' de protéines. Après un repas en boîte, il reste ≈ '+(tg.kcalMid-a.kcal).toLocaleString("fr-FR")+' kcal et ≈ '+(tg.protMid-a.prot)+' g de protéines pour le reste de la journée.</p>';
    h+='</section>';
    if(m.budget){
      var b=m.budget;
      h+='<section class="card"><h4>Budget estimé · ≈ '+b.total+' € pour les 5 sessions</h4>'+
        (m.sessions||[]).map(function(s){ return '<div class="brow"><span>'+esc(s.title)+'</span><span>≈ '+s.budget+' €</span></div>'; }).join("")+
        '<p class="note">≈ '+String(b.perMeal).replace(".",",")+' € par repas à deux. '+esc(b.note||"")+'</p>'+
        ((b.tips&&b.tips.length)?'<h4 style="margin-top:16px">Pour baisser la note</h4><ul>'+b.tips.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':'')+'</section>';
    }
    if(m.tips && m.tips.length) h+='<section class="card"><h4>Conservation et astuces</h4><ul>'+m.tips.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></section>';
    if(m.intro) h+='<p class="hint">'+esc(m.intro)+'</p>';
    h+='<button type="button" class="linkbtn" data-forget="1">Verrouiller l\'appli sur ce téléphone</button>';
    return h;
  }

  function viewEmpty(){
    return '<div class="card empty"><h3>Les sessions du mois apparaîtront ici</h3><p>5 sessions de meal prep à lancer quand vous voulez, chacune avec 3 plats, sa liste de courses et ses recettes.</p>'+
      '<p>Elles s\'ajoutent automatiquement le 1er de chaque mois. Si rien ne s\'affiche, vérifie ta connexion internet puis rouvre l\'appli.</p></div>';
  }

  function viewLock(){
    return '<form class="lock" id="lock-form" autocomplete="on"><span class="tape" style="align-self:flex-start">Y · L</span><h3>Appli verrouillée</h3><p>Entre le mot de passe pour afficher les sessions du mois. Il ne sera demandé qu\'une fois sur ce téléphone.</p>'+
      '<input type="text" name="username" value="meal-prep" autocomplete="username" hidden>'+
      '<input type="password" id="lock-pw" name="password" autocomplete="current-password" placeholder="Mot de passe" autocapitalize="none" autocorrect="off" spellcheck="false" required>'+
      '<div class="err" id="lock-err" role="alert"></div><button type="submit" class="btn" id="lock-btn">Déverrouiller</button></form>';
  }

  function render(){
    var title=$("month-title");
    if(S.months.length>1){
      title.innerHTML='<select id="month-select" aria-label="Choisir le mois">'+S.months.map(function(m){return '<option value="'+esc(m.key)+'"'+(m.key===S.key?" selected":"")+'>'+esc(m.label)+' ▾</option>';}).join("")+'</select>';
    } else title.textContent=S.month?S.month.label:"Plan du mois";
    $("who-y").setAttribute("aria-pressed", S.who==="Y"); $("who-l").setAttribute("aria-pressed", S.who==="L");
    Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"),function(b){ if(b.getAttribute("data-tab")===S.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
    var v=$("view"), h='';
    document.querySelector(".tabs").hidden=!!S.locked;
    if(S.locked){ v.innerHTML=viewLock(); return; }
    if(S.offline) h+='<div class="status">Hors connexion : dernière version enregistrée sur ce téléphone.</div>';
    if(!S.month) h+= S.loaded ? viewEmpty() : v.innerHTML;
    else if(S.tab==="recipes") h+=viewRecipes();
    else if(S.tab==="infos") h+=viewInfos();
    else if(S.session && sess(S.session)) h+=viewSession(sess(S.session));
    else h+=viewSessions();
    v.innerHTML=h;
    if(S.recipe) renderSheet();
  }

  /* ---------- recipe sheet ---------- */
  function plate(r, who){
    var y=who==="Y", p=y?r.y:r.l;
    var m=y?'<span><b>'+p.kcal+'</b> kcal</span><span><b>'+p.prot+'</b> g prot</span><span><b>'+p.fib+'</b> g fibres</span>':'<span>≈ <b>'+p.kcal+'</b> kcal</span><span>version plaisir</span>';
    return '<div class="plate '+(y?"y":"l")+'"><span class="tape">'+(y?"Y · "+esc(pname("Y")).toUpperCase():"L · "+esc(pname("L")).toUpperCase())+'</span><p>'+esc(p.text)+'</p><div class="macros">'+m+'</div></div>';
  }
  function renderSheet(){
    var r=rec(S.recipe), sh=$("sheet");
    if(!r){ closeSheet(); return; }
    var s=sess(r.session), o=S.who==="Y"?["Y","L"]:["L","Y"];
    sh.innerHTML='<div class="sheet-bar"><div class="wrap"><button type="button" class="back" data-close="1">'+backIcon()+'Retour</button><span class="count">'+esc(r.id)+'</span></div></div>'+
      '<div class="wrap body"><div><div class="eyebrow">'+esc(s?s.title:"")+'</div><h1>'+esc(r.name)+'</h1><div class="meta"><span>'+esc(r.time)+'</span><span>4 portions : 2 Y + 2 L</span><span>'+esc(r.keeps||"")+'</span></div></div>'+
      '<div class="plates">'+plate(r,o[0])+plate(r,o[1])+'</div>'+
      '<div class="card block"><h4>Base commune</h4><p>'+esc(r.base)+'</p></div>'+
      '<div class="card block"><h4>Étapes</h4><ol class="steps">'+r.steps.map(function(x){return '<li><span>'+esc(x)+'</span></li>';}).join("")+'</ol></div>'+
      '<div class="card block"><h4>Portionnage</h4><p>'+esc(r.portion)+'</p></div></div>';
  }
  function openRecipe(id){
    S.recipe=id; var sh=$("sheet"); renderSheet(); sh.hidden=false; sh.scrollTop=0;
    sh.classList.remove("sheet-in"); void sh.offsetWidth; sh.classList.add("sheet-in");
    document.documentElement.style.overflow="hidden";
  }
  function closeSheet(){ S.recipe=null; $("sheet").hidden=true; document.documentElement.style.overflow=""; }

  /* ---------- actions ---------- */
  function refreshShop(){
    var s=sess(S.session); if(!s) return;
    var st=shopStats(s), c=$("shop-count"), b=$("shop-bar");
    if(c) c.textContent=st.done+"/"+st.total;
    if(b) b.style.width=(st.total?Math.round(100*st.done/st.total):0)+"%";
  }
  document.addEventListener("click",function(e){
    var el=e.target.closest("[data-recipe],[data-tab],[data-who],[data-close],[data-session],[data-back],[data-done],[data-reset],[data-forget]"); if(!el) return;
    if(el.hasAttribute("data-forget")){ forgetKey(); return; }
    if(el.hasAttribute("data-recipe")) openRecipe(el.getAttribute("data-recipe"));
    else if(el.hasAttribute("data-session")){ S.session=el.getAttribute("data-session"); S.tab="sessions"; render(); window.scrollTo(0,0); }
    else if(el.hasAttribute("data-back")){ S.session=null; render(); window.scrollTo(0,0); }
    else if(el.hasAttribute("data-done")){
      var id=el.getAttribute("data-done"), y=window.scrollY;
      if(S.done[id]) delete S.done[id]; else S.done[id]=todayISO();
      saveDone(); render(); window.scrollTo(0,y);
    }
    else if(el.hasAttribute("data-reset")){
      var s=sess(el.getAttribute("data-reset")), y2=window.scrollY;
      if(s) (s.shopping||[]).forEach(function(g){ g.items.forEach(function(it){ delete S.checks[it.id]; }); });
      saveChecks(); render(); window.scrollTo(0,y2);
    }
    else if(el.hasAttribute("data-tab")){
      var t=el.getAttribute("data-tab");
      if(t==="sessions" && S.tab==="sessions") S.session=null;
      S.tab=t; ls("mp-tab",t); closeSheet(); render(); window.scrollTo(0,0);
    }
    else if(el.hasAttribute("data-who")){ S.who=el.getAttribute("data-who"); ls("mp-who",S.who); render(); }
    else if(el.hasAttribute("data-close")) closeSheet();
  });
  document.addEventListener("change",function(e){
    var t=e.target;
    if(t.matches && t.matches("[data-item]")){
      var id=t.getAttribute("data-item");
      if(t.checked) S.checks[id]=true; else delete S.checks[id];
      saveChecks(); refreshShop();
    } else if(t.id==="month-select"){
      S.key=t.value; S.months.forEach(function(m){ if(m.key===S.key) S.month=m; });
      S.session=null; loadLocal(); render();
    }
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && S.recipe) closeSheet(); });

  /* ---------- data (encrypted: PBKDF2-SHA256 + AES-256-GCM) ---------- */
  var IDX=null, KEY=null, CHECK="meal-prep-ok";
  function b64d(t){ var bin=atob(t), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  function b64e(buf){ var a=new Uint8Array(buf), t=""; for(var i=0;i<a.length;i++) t+=String.fromCharCode(a[i]); return btoa(t); }
  function derive(pw,kdf){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(kdf.salt), iterations:kdf.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
    });
  }
  function openBlob(key,blob){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(blob.iv)}, key, b64d(blob.ct)).then(function(buf){ return new TextDecoder().decode(buf); }); }
  function storedKey(){
    var st=lsJSON("mp-key");
    if(!st || !IDX || st.salt!==IDX.kdf.salt) return Promise.resolve(null);
    return crypto.subtle.importKey("raw", b64d(st.k), {name:"AES-GCM"}, true, ["decrypt"]).catch(function(){ return null; });
  }
  function getJSON(url,bust){
    return fetch(url+(bust?"?t="+Date.now():""),{cache:bust?"no-store":"default"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function loadMonths(bust,offline){
    return Promise.all((IDX.months||[]).map(function(k){
      return getJSON("data/"+k+".json",bust).catch(function(){ return getJSON("data/"+k+".json",false); })
        .then(function(blob){ return openBlob(KEY,blob); }).then(function(t){ return JSON.parse(t); }).catch(function(){ return null; });
    })).then(function(list){ setMonths(list.filter(Boolean), offline); });
  }
  function boot(){
    if(!window.crypto || !crypto.subtle){ S.loaded=true; render(); return; }
    var offline=false;
    getJSON("data/index.json",true).catch(function(){ offline=true; return getJSON("data/index.json",false); })
    .then(function(idx){ IDX=idx; return storedKey(); })
    .then(function(k){
      if(!k){ S.locked=true; S.loaded=true; render(); return; }
      return openBlob(k, IDX.check).then(function(t){
        if(t!==CHECK) throw 0;
        KEY=k; S.locked=false; return loadMonths(!offline, offline);
      }).catch(function(){ ls("mp-key",""); S.locked=true; S.loaded=true; render(); });
    })
    .catch(function(){ S.loaded=true; render(); });
  }
  function unlock(pw){
    var btn=$("lock-btn"), err=$("lock-err");
    if(btn){ btn.disabled=true; btn.textContent="Vérification…"; }
    if(err) err.textContent="";
    derive(pw, IDX.kdf).then(function(k){
      return openBlob(k, IDX.check).then(function(t){
        if(t!==CHECK) throw 0;
        return crypto.subtle.exportKey("raw", k).then(function(raw){
          ls("mp-key", JSON.stringify({salt:IDX.kdf.salt, k:b64e(raw)}));
          KEY=k; S.locked=false; S.loaded=false; return loadMonths(true,false);
        });
      });
    }).catch(function(){
      if(err) err.textContent="Mot de passe incorrect. Vérifie les tirets et les chiffres à la fin.";
      if(btn){ btn.disabled=false; btn.textContent="Déverrouiller"; }
    });
  }
  function forgetKey(){
    ls("mp-key",""); KEY=null; S.locked=true; S.months=[]; S.month=null; S.key=null; S.session=null;
    closeSheet(); render(); window.scrollTo(0,0);
  }
  document.addEventListener("submit",function(e){
    if(e.target && e.target.id==="lock-form"){ e.preventDefault(); var v=($("lock-pw")||{}).value||""; if(v && IDX) unlock(v.trim()); }
  });
  boot();
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible" && KEY) boot(); });
  if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>
